name: Main branch security scan and smoke deployment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: main-security-scan-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security-scan:
    name: Scan and enforce security gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOCAL_IMAGE: devsecops-lab:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate exception policy
        run: python Code/DevSecOps/tools/check_exceptions.py Code/DevSecOps/policy/exceptions.json

      - name: Install pinned Python scanners
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.179.0 checkov==3.3.30

      - name: Install pinned scanners and SBOM tooling
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          sudo install "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
          curl -fsSL https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/syft.tar.gz"
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP" syft
          sudo install "$RUNNER_TEMP/syft" /usr/local/bin/syft
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.64.0/conftest_0.64.0_Linux_x86_64.tar.gz -o "$RUNNER_TEMP/conftest.tar.gz"
          tar -xzf "$RUNNER_TEMP/conftest.tar.gz" -C "$RUNNER_TEMP" conftest
          sudo install "$RUNNER_TEMP/conftest" /usr/local/bin/conftest

      - name: Prepare reports and build local fixed image
        run: |
          mkdir -p Code/DevSecOps/tests/results/raw Code/DevSecOps/reports
          docker build --pull --file Code/DevSecOps/lab/docker/Dockerfile.fixed --tag "$LOCAL_IMAGE" Code/DevSecOps

      - name: Scan source, IaC, secrets, and local image
        run: |
          semgrep scan --metrics=off --config Code/DevSecOps/rules/semgrep --json --output Code/DevSecOps/tests/results/raw/semgrep.json Code/DevSecOps/src
          gitleaks dir Code/DevSecOps --config Code/DevSecOps/.gitleaks.toml --report-format json --report-path Code/DevSecOps/tests/results/raw/gitleaks.json --exit-code 0
          trivy fs --scanners vuln,misconfig,secret --skip-dirs Code/DevSecOps/ground_truth/patches --skip-dirs Code/DevSecOps/tests/results --skip-dirs Code/DevSecOps/reports --skip-dirs Code/DevSecOps/.venv --skip-dirs Code/DevSecOps/__pycache__ --skip-files Code/DevSecOps/lab/docker/Dockerfile.vuln --format json --output Code/DevSecOps/tests/results/raw/trivy-fs.json --exit-code 0 --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL Code/DevSecOps
          trivy image --format json --output Code/DevSecOps/tests/results/raw/trivy-image.json --exit-code 0 --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL "$LOCAL_IMAGE"
          checkov -d Code/DevSecOps/infra -o json --output-file-path Code/DevSecOps/tests/results/raw --soft-fail
          mv Code/DevSecOps/tests/results/raw/results_json.json Code/DevSecOps/tests/results/raw/checkov.json
          syft "$LOCAL_IMAGE" -o cyclonedx-json=Code/DevSecOps/tests/results/raw/sbom.cyclonedx.json

      - name: Normalize and fail closed on scan errors
        run: |
          python Code/DevSecOps/tools/test/summarize.py --results Code/DevSecOps/tests/results/raw --output-dir Code/DevSecOps/reports --exceptions Code/DevSecOps/policy/exceptions.json --require semgrep,gitleaks,trivy-fs,trivy-image,checkov --run-id "$GITHUB_RUN_ID" --commit-sha "$GITHUB_SHA"
          cat Code/DevSecOps/reports/pr-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate g0 warning policy
        continue-on-error: true
        run: conftest test Code/DevSecOps/reports/summary.json --policy Code/DevSecOps/policy/g0

      - name: Enforce g1 high and critical gate
        run: conftest test Code/DevSecOps/reports/summary.json --policy Code/DevSecOps/policy/g1 --policy Code/DevSecOps/rules/conftest --data Code/DevSecOps/policy/exceptions.json

      - name: Enforce g2 IaC, image, and secret gate
        run: conftest test Code/DevSecOps/reports/summary.json --policy Code/DevSecOps/policy/g2 --policy Code/DevSecOps/rules/conftest --data Code/DevSecOps/policy/exceptions.json

      - name: Deploy validated image to an ephemeral runner
        env:
          IMAGE: ${{ env.LOCAL_IMAGE }}
        run: |
          set -uo pipefail
          deploy_dir=Code/DevSecOps/tests/results/deploy
          mkdir -p "$deploy_dir"
          report="$deploy_dir/deployment.json"
          container="devsecops-${GITHUB_RUN_ID}"
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          started_epoch=$(date +%s)
          image_digest=$(docker image inspect --format='{{.Id}}' "$IMAGE")
          status=failed
          response=

          if docker run --detach --rm --name "$container" \
            --publish 127.0.0.1:5000:5000 "$IMAGE"; then
            for attempt in $(seq 1 20); do
              if response=$(curl --connect-timeout 2 --max-time 3 --fail --silent \
                http://127.0.0.1:5000/health); then
                status=passed
                break
              fi
              sleep 2
            done
          fi

          docker logs "$container" > "$deploy_dir/container.log" 2>&1 || true
          docker stop "$container" >/dev/null 2>&1 || true
          finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration_s=$(( $(date +%s) - started_epoch ))

          HEALTH_RESPONSE="$response" python - "$report" "$IMAGE" "$image_digest" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$status" "$started_at" \
            "$finished_at" "$duration_s" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          (report, image, digest, commit, run_id, status,
           started, finished, duration) = sys.argv[1:]
          raw_health = os.environ.get("HEALTH_RESPONSE", "")
          try:
              health = json.loads(raw_health) if raw_health else None
          except json.JSONDecodeError:
              health = {"raw": raw_health}
          evidence = {
              "deployment_scope": "ephemeral local container on GitHub-hosted runner",
              "external_cloud": False,
              "image": image,
              "image_digest": digest,
              "commit_sha": commit,
              "run_id": run_id,
              "status": status,
              "health_endpoint": "http://127.0.0.1:5000/health",
              "health_response": health,
              "started_at_utc": started,
              "finished_at_utc": finished,
              "duration_s": int(duration),
              "container_cleanup": "attempted",
          }
          Path(report).write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(evidence, indent=2))
          PY

          test "$status" = passed

      - name: Upload security scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-security-scan-evidence
          path: |
            Code/DevSecOps/tests/results/raw/
            Code/DevSecOps/reports/
            Code/DevSecOps/tests/results/deploy/
          if-no-files-found: warn
          retention-days: 90
