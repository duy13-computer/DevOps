name: Ground truth before-after experiment

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      phase:
        description: State to measure
        required: true
        type: choice
        options:
          - baseline
          - after-fix

permissions:
  contents: read

concurrency:
  group: ground-truth-${{ github.ref }}-${{ inputs.phase || 'pull-request' }}
  cancel-in-progress: false

jobs:
  experiment:
    if: github.event_name == 'pull_request' || matrix.phase == inputs.phase
    name: Measure ${{ matrix.phase }} state
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        phase: [baseline, after-fix]
    env:
      PHASE: ${{ matrix.phase }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned Python scanners
        run: python -m pip install --disable-pip-version-check semgrep==1.179.0 checkov==3.3.30

      - name: Install pinned scanner and SBOM CLIs
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          sudo install "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
          curl -fsSL https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/syft.tar.gz"
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP" syft
          sudo install "$RUNNER_TEMP/syft" /usr/local/bin/syft

      - name: Validate exception policy
        run: python Code/DevSecOps/tools/check_exceptions.py Code/DevSecOps/policy/exceptions.json

      - name: Install Conftest
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.64.0/conftest_0.64.0_Linux_x86_64.tar.gz -o "$RUNNER_TEMP/conftest.tar.gz"
          tar -xzf "$RUNNER_TEMP/conftest.tar.gz" -C "$RUNNER_TEMP" conftest
          sudo install "$RUNNER_TEMP/conftest" /usr/local/bin/conftest

      - name: Install GNU Parallel and warm Trivy vulnerability database
        run: |
          sudo apt-get update
          sudo apt-get install --yes parallel
          parallel --will-cite --version | head -n 1
          trivy image --download-db-only

      - name: Record runner and scanner versions
        run: |
          evidence="Code/DevSecOps/tests/results/experiments/$GITHUB_RUN_ID/$PHASE"
          mkdir -p "$evidence"
          python - "$evidence/environment.json" <<'PY'
          import json
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path

          def version(command):
              result = subprocess.run(command, text=True, capture_output=True, check=False)
              output = (result.stdout or result.stderr).strip().splitlines()
              return {"exit_code": result.returncode, "output": output[:3]}

          data = {
              "run_id": os.environ["GITHUB_RUN_ID"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "phase": os.environ["PHASE"],
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "kernel": platform.platform(),
              "python": sys.version,
              "cache_policy": "Trivy vulnerability DB warmed before timing; scanner cache reused within this job",
              "tool_versions": {
                  "semgrep": version(["semgrep", "--version"]),
                  "gitleaks": version(["gitleaks", "version"]),
                  "trivy": version(["trivy", "--version"]),
                  "checkov": version(["checkov", "--version"]),
                  "conftest": version(["conftest", "--version"]),
                  "syft": version(["syft", "version"]),
                  "parallel": version(["parallel", "--version"]),
                  "docker": version(["docker", "version", "--format", "{{.Server.Version}}"]),
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Run five repeated scans and create SBOMs
        run: |
          python Code/DevSecOps/tools/test/measure_pipeline.py "--${PHASE}" --runs 5 --include-image --run-id "$GITHUB_RUN_ID" --commit-sha "$GITHUB_SHA"

      - name: Prove expected gate outcome for each run
        run: |
          evidence="Code/DevSecOps/tests/results/experiments/$GITHUB_RUN_ID/$PHASE/gate-results.txt"
          mkdir -p "$(dirname "$evidence")"
          : > "$evidence"
          shopt -s nullglob
          reports=(Code/DevSecOps/tests/results/experiments/"$GITHUB_RUN_ID"/"$PHASE"/run-*/summary/summary.json)
          test "${#reports[@]}" -eq 5
          for report in "${reports[@]}"; do
            if [ "$PHASE" = baseline ]; then
              conftest test "$report" --policy Code/DevSecOps/policy/g0 2>&1 | tee -a "$evidence"
              for gate in g1 g2; do
                if gate_output=$(conftest test "$report" --policy "Code/DevSecOps/policy/$gate" --policy Code/DevSecOps/rules/conftest --data Code/DevSecOps/policy/exceptions.json 2>&1); then
                  echo "FAIL: vulnerable baseline unexpectedly passed $gate ($report)" | tee -a "$evidence"
                  exit 1
                else
                  printf '%s\n' "$gate_output" | tee -a "$evidence"
                  if [[ "$gate_output" != *"$gate blocked"* ]]; then
                    echo "FAIL: $gate returned an error without a policy denial ($report)" | tee -a "$evidence"
                    exit 1
                  fi
                  echo "PASS: vulnerable baseline was blocked by $gate as expected ($report)" | tee -a "$evidence"
                fi
              done
            else
              conftest test "$report" --policy Code/DevSecOps/policy/g0
              conftest test "$report" --policy Code/DevSecOps/policy/g1 --policy Code/DevSecOps/rules/conftest --data Code/DevSecOps/policy/exceptions.json
              conftest test "$report" --policy Code/DevSecOps/policy/g2 --policy Code/DevSecOps/rules/conftest --data Code/DevSecOps/policy/exceptions.json
              echo "PASS: after-fix passed g1 and g2 ($report)" | tee -a "$evidence"
            fi
          done

      - name: Compare sequential and parallel scanner timings
        run: |
          bash Code/DevSecOps/tools/test/benchmark_parallel.sh "--${PHASE}" --runs 3

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ground-truth-${{ matrix.phase }}-${{ github.run_id }}
          path: |
            Code/DevSecOps/tests/results/experiments/${{ github.run_id }}/
            Code/DevSecOps/tests/results/metrics/pipeline_time.csv
            Code/DevSecOps/tests/results/metrics/detection_rate.csv
            Code/DevSecOps/tests/results/metrics/parallel_vs_seq.csv
            Code/DevSecOps/tests/results/triage/
          if-no-files-found: warn
          retention-days: 90
