rules:
  - id: generic.secrets.hardcoded-password
    message: Do not commit a hard-coded password or secret; load it from a secret manager.
    severity: ERROR
    languages:
      - python
    patterns:
      - pattern: $NAME = "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)(password|passwd|pwd|secret|token)
    metadata:
      severity: HIGH
      cwe: CWE-798
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
      category: security
      technology:
        - python
